name: debug-probe(調査用・後で削除)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 各ソースのRSS URLとAPI応答を調査
        run: |
          set +e
          echo "=== JILPT homepage rss/rdf/xml links ==="
          curl -sSL https://www.jil.go.jp/ | grep -oiE '(href|src)="[^"]*(rss|\.rdf|\.xml)[^"]*"' | sort -u
          echo "=== RIETI faq page rss links ==="
          curl -sSL https://www.rieti.go.jp/jp/faq.html | grep -oiE 'href="[^"]*(rss|\.rdf|\.xml)[^"]*"' | sort -u
          echo "=== RIETI homepage rss links ==="
          curl -sSL https://www.rieti.go.jp/ | grep -oiE '(href|src)="[^"]*(rss|\.rdf|\.xml)[^"]*"' | sort -u
          echo "=== J-STAGE api: article=人事 (no year filter) first 4000 chars ==="
          curl -sSL "https://api.jstage.jst.go.jp/searchapi/do?service=3&article=%E4%BA%BA%E4%BA%8B&count=2" | head -c 4000
          echo ""
          echo "=== J-STAGE api: article=人事 pubyearfrom=2026 first 1500 chars ==="
          curl -sSL "https://api.jstage.jst.go.jp/searchapi/do?service=3&article=%E4%BA%BA%E4%BA%8B&pubyearfrom=2026&count=2" | head -c 1500
          echo ""
          echo "=== NHK cat5 first 800 chars ==="
          curl -sSL https://www3.nhk.or.jp/rss/news/cat5.xml | head -c 800
          echo ""
          true
