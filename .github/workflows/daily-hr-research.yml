name: 平日 人事研究レポート

on:
  schedule:
    # 平日 7:00 JST = 前日 22:00 UTC(日〜木曜UTC = 月〜金曜JST)
    - cron: "0 22 * * 0-4"
  workflow_dispatch: {}  # 手動実行(Actionsタブの Run workflow ボタン)も可能

permissions:
  contents: write
  issues: write
  models: read  # GitHub Models(AI要約)の利用に必要

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 研究情報を収集してレポート生成
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # AI要約(GitHub Models)用
        run: python scripts/collect_hr_research.py

      - name: レポートをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "人事研究デイリーレポート $(date -d '+9 hours' +%Y-%m-%d)"
            git push
          fi

      - name: レポートを Issue として投稿(通知用)
        if: steps.collect.outputs.new_items != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PATH: ${{ steps.collect.outputs.report_path }}
        run: |
          TITLE="📊 人事研究デイリーレポート $(date -d '+9 hours' +%Y-%m-%d)"
          # Issue本文の上限(65536字)に収まるよう安全側で切り詰める
          head -c 60000 "$REPORT_PATH" > /tmp/issue_body.md
          if [ "$(wc -c < "$REPORT_PATH")" -gt 60000 ]; then
            echo "" >> /tmp/issue_body.md
            echo "…(全文はリポジトリ内の \`$REPORT_PATH\` を参照)" >> /tmp/issue_body.md
          fi
          gh issue create --title "$TITLE" --body-file /tmp/issue_body.md \
            --label "daily-report" || \
          gh issue create --title "$TITLE" --body-file /tmp/issue_body.md
