# 収集対象の設定ファイル
# ここを編集するだけで検索キーワードや収集元を変更できます。
#
# 方針: 収集元は「査読論文データベース」と「公的機関」に限定し、
#       個人・企業の根拠が曖昧なコラム類は構造的に排除する。

# 収集対象期間(日数)。平日毎日実行のため、週末分の取りこぼし防止で3日に設定
# (重複は seen.json で自動排除されるので重なっても問題なし)
window_days: 3

# ---------------------------------------------------------------
# 論文の掲載設定
# 収集した国内外の論文をトレンドとの関連度でスコアリングし、
# 上位 limit 件だけをレポートに掲載する。
# ---------------------------------------------------------------
papers:
  limit: 3

# ---------------------------------------------------------------
# トレンド判定の設定
# 前日(収集期間内)の新聞・業界誌記事のタイトル・本文抜粋から
# 下記キーワードの出現記事数を集計し、上位 top_n をその日の
# トレンドとしてレポート冒頭に表示する。論文選定にも使われる。
# ラベル(左)は表示名、右のリストは表記ゆれ(英語含む)。
# ---------------------------------------------------------------
trends:
  top_n: 5
  keywords:
    賃上げ: [賃上げ, 春闘, ベースアップ, 賃金引上げ, wage increase, pay raise]
    最低賃金: [最低賃金, minimum wage]
    人手不足: [人手不足, 採用難, 人材不足, 人材確保, labor shortage]
    人的資本: [人的資本, human capital]
    ジョブ型雇用: [ジョブ型, job-based, job型]
    リスキリング: [リスキリング, 学び直し, リカレント, reskilling, upskilling]
    タレントマネジメント: [タレントマネジメント, タレントマネージメント, talent management]
    採用: [採用, 求人, 内定, 就活, hiring, recruitment, recruiting]
    人事評価: [人事評価, 評価制度, 実力本位, performance appraisal, performance management]
    離職・定着: [離職, 退職, 定着, 退職代行, turnover, retention, attrition]
    エンゲージメント: [エンゲージメント, 従業員満足, engagement, job satisfaction]
    ウェルビーイング: [ウェルビーイング, 健康経営, well-being, wellbeing, メンタルヘルス]
    リモートワーク: [リモートワーク, テレワーク, 在宅勤務, 出社回帰, remote work, hybrid work]
    生成AIと人事: [生成ai, ai活用, ai人材, chatgpt, 人工知能, artificial intelligence]
    育児・介護との両立: [育休, 育児休業, 介護離職, 両立支援, childcare, parental leave]
    女性活躍: [女性活躍, 女性管理職, ジェンダー, gender]
    副業・兼業: [副業, 兼業, side job, moonlighting]
    高齢者雇用: [高齢者雇用, シニア雇用, 定年, 再雇用, older worker]
    外国人労働者: [外国人労働者, 外国人材, 特定技能, 技能実習, migrant worker, foreign worker]
    働き方改革: [働き方改革, 労働時間, 残業, 週休3日, working hours, four-day]
    人事異動・人事制度: [人事制度, 人事異動, 人事戦略, 人材戦略]

# ---------------------------------------------------------------
# AI要約の設定
# GitHub Actions内蔵の GitHub Models(無料・追加設定不要)を使い、
# 各記事の抄録・本文抜粋から日本語1〜2文の要約を生成する。
# 失敗した場合は原文の抜粋がそのまま要約欄に載る。
# ---------------------------------------------------------------
summarize:
  enabled: true
  model: openai/gpt-4o-mini
  chunk_size: 15  # 1回のAI呼び出しで要約する記事数

# ---------------------------------------------------------------
# 海外の学術論文: OpenAlex (https://openalex.org)
# 世界最大級のオープン学術データベース。査読付き論文のみ取得。
# ---------------------------------------------------------------
openalex:
  max_per_query: 10
  # タイトル・抄録に対する検索フレーズ(英語)。
  # OR検索は無関係な論文が混ざりやすいため、1クエリ=1フレーズにする。
  # 英語論文に限定(language:en)。
  queries:
    - '"human resource management"'
    - '"people analytics"'
    - '"employee turnover"'
    - '"employee retention"'
    - '"talent management"'
    - '"performance appraisal"'
    - '"employee engagement"'
    - '"job satisfaction"'
    - '"remote work"'
    - '"hybrid work"'

# ---------------------------------------------------------------
# 国内の学術論文: J-STAGE (https://www.jstage.jst.go.jp)
# 科学技術振興機構(JST)が運営する国内最大の学術論文プラットフォーム。
# ---------------------------------------------------------------
jstage:
  max_per_query: 10
  # 論文タイトルに対する検索キーワード(日本語)
  queries:
    - 人事管理
    - 人的資源管理
    - 人材マネジメント
    - 組織行動
    - 採用
    - 賃金
    - 働き方

# ---------------------------------------------------------------
# RSSフィード(公的機関・研究機関・新聞報道・業界誌)
# - category: public   → レポートの「公的機関・研究機関」欄に表示
# - category: news     → レポートの「新聞」欄に表示
# - category: industry → レポートの「業界誌」欄に表示
# - keywords が空の場合は全件対象(検索URL自体で絞られている場合など)。
#   keywords がある場合はタイトルにいずれかを含むものだけ収集。
# - params はURLのクエリパラメータ(日本語もそのまま書ける)
# - URLが変更された場合はレポートに「取得失敗」と表示されるので、
#   ここを修正してください。
# ---------------------------------------------------------------
feeds:
  - name: 厚生労働省 新着情報
    category: public
    url: https://www.mhlw.go.jp/stf/news.rdf
    keywords: [雇用, 賃金, 労働, 人材, 職業, 働き方, 統計, 調査]

  # 注: JILPT(労働政策研究・研修機構)は公式サイトにRSS配信がないため
  # 収集元に含められません。JILPTの新着はメールマガジン(メルマガ登録)で
  # 受け取るか、厚労省RSS経由の関連情報でカバーしてください。

  - name: RIETI 経済産業研究所
    category: public
    url: https://www.rieti.go.jp/jp/rss/index.rdf
    keywords: [雇用, 賃金, 労働, 人材, 人事, 働き方]

  - name: NBER Working Papers(全米経済研究所)
    category: public
    url: https://back.nber.org/rss/new.xml
    keywords: [labor, employment, wage, worker, hiring, human capital,
               personnel, workplace, job, retention]

  # ---- 新聞・報道 ----
  # Google News検索RSS: 全国紙・通信社・経済メディアの記事を横断的に取得
  - name: 新聞記事(人事・人的資本)
    category: news
    url: https://news.google.com/rss/search
    params:
      q: 人事制度 OR 人的資本 OR 人材戦略 OR タレントマネジメント
      hl: ja
      gl: JP
      ceid: "JP:ja"
    keywords: []

  - name: 新聞記事(雇用・賃金・労働)
    category: news
    url: https://news.google.com/rss/search
    params:
      q: 雇用統計 OR 賃上げ OR 春闘 OR 労働市場 OR 人手不足
      hl: ja
      gl: JP
      ceid: "JP:ja"
    keywords: []

  - name: NHKニュース(経済)
    category: news
    url: https://www3.nhk.or.jp/rss/news/cat5.xml
    keywords: [雇用, 賃金, 賃上げ, 人事, 採用, 労働, 働き方, 人手不足, 求人, 春闘]

  # ---- 業界誌(HR専門メディア) ----
  # 注: 日本の人事部・リクルートワークス研究所・労務行政はRSS配信がないため
  # 収集元に含められません(記事はGoogle News経由で拾われることがあります)。
  - name: HR NOTE(業界誌)
    category: industry
    url: https://hrnote.jp/feed/
    keywords: []

  - name: HRzine(業界誌)
    category: industry
    url: https://hrzine.jp/rss/new/index.xml
    keywords: []
